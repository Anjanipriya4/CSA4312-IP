
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian National Flag</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 40px 15px;
        }

        h1 {
            color: #222;
        }

        .flag {
            width: min(600px, 90vw);
            aspect-ratio: 3 / 2;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
        }

        .saffron,
        .white,
        .green {
            height: 33.3333%;
        }

        .saffron {
            background: #FF9933;
        }

        .white {
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .green {
            background: #138808;
        }

        .chakra {
            width: 30%;
            height: auto;
            aspect-ratio: 1;
            color: #000080;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Indian National Flag</h1>

    <div class="flag">
        <div class="saffron"></div>

        <div class="white">
            <svg class="chakra" viewBox="0 0 100 100"
                 xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="47"
                        fill="none" stroke="#000080" stroke-width="2.5"/>

                <g stroke="#000080" stroke-width="1.5">
                    <line x1="50" y1="50" x2="50" y2="3"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(15 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(30 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(45 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(60 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(75 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(90 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(105 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(120 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(135 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(150 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(165 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(180 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(195 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(210 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(225 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(240 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(255 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(270 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(285 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(300 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(315 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(330 50 50)"/>
                    <line x1="50" y1="50" x2="50" y2="3"
                          transform="rotate(345 50 50)"/>
                </g>

                <circle cx="50" cy="50" r="4"
                        fill="#000080"/>
            </svg>
        </div>

        <div class="green"></div>
    </div>

    <p>जय हिन्द! 🇮🇳</p>

</body>
</html>
